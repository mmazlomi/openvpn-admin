# ---------------------------------------------------------------------------
# nginx reverse proxy for the OpenVPN admin panel.
#
# 1. Replace vpn-admin.example.com with YOUR real domain (DNS must point here).
# 2. Obtain a certificate:  certbot --nginx -d vpn-admin.example.com
#    (or drop in your own cert/key paths below).
# 3. Copy this file to /etc/nginx/sites-available/openvpn-admin.conf
#    ln -s ../sites-available/openvpn-admin.conf /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
#
# Do NOT edit the existing default site in place — add this as a new server
# block. Inspect `nginx -T` first to be sure the server_name does not collide.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name vpn-admin.example.com;          # <-- CHANGE ME

    # ACME challenge stays on HTTP; everything else redirects to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vpn-admin.example.com;          # <-- CHANGE ME

    ssl_certificate     /etc/letsencrypt/live/vpn-admin.example.com/fullchain.pem;   # <-- CHANGE ME
    ssl_certificate_key /etc/letsencrypt/live/vpn-admin.example.com/privkey.pem;     # <-- CHANGE ME

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:OVPNADMIN:10m;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # The .ovpn download and API responses are small; keep a modest cap.
    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:8282;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Optional: restrict the panel to an office/admin IP range.
    # allow 203.0.113.0/24;
    # deny all;
}

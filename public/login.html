<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ورود — پنل مدیریت OpenVPN</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <h1>پنل مدیریت OpenVPN</h1>
    <p class="muted">برای ادامه وارد شوید</p>

    <form id="login-form" autocomplete="off">
      <label for="username">نام کاربری</label>
      <input id="username" name="username" type="text" required autocapitalize="none" spellcheck="false" />

      <label for="password">گذرواژه</label>
      <input id="password" name="password" type="password" required />

      <button type="submit" id="login-btn">ورود</button>
      <p id="login-error" class="error" role="alert" hidden></p>
    </form>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
